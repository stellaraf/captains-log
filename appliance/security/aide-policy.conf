# NebulaLog host/configuration coverage. Header/output paths are manager-owned.
# Explicit SHA-512 avoids algorithm sets that contain nonapproved hashes.
NEBULALOGSTATIC = ftype+p+i+l+n+u+g+s+m+c+acl+selinux+xattrs+sha512
NEBULALOGDIRECTORY = ftype+p+i+u+g+acl+selinux+xattrs

/boot(/.*)? d NEBULALOGDIRECTORY
/boot(/.*)? f,l,p,s,c,b NEBULALOGSTATIC
/usr(/.*)? d NEBULALOGDIRECTORY
/usr(/.*)? f,l,p,s,c,b NEBULALOGSTATIC
/etc(/.*)? d NEBULALOGDIRECTORY
/etc(/.*)? f,l,p,s,c,b NEBULALOGSTATIC
/root(/.*)? d NEBULALOGDIRECTORY
/root(/.*)? f,l,p,s,c,b NEBULALOGSTATIC
/home(/.*)? d NEBULALOGDIRECTORY
/home(/.*)? f,l,p,s,c,b NEBULALOGSTATIC
/var/spool/cron(/.*)? d NEBULALOGDIRECTORY
/var/spool/cron(/.*)? f,l,p,s,c,b NEBULALOGSTATIC
/var/lib/nebulalog/configuration(/.*)? d NEBULALOGDIRECTORY
/var/lib/nebulalog/configuration(/.*)? f,l,p,s,c,b NEBULALOGSTATIC

# Explicitly mutable evidence, not the selected policy or static runtime config.
-/etc/nebulalog/configured$
-/etc/nebulalog/bootstrap/audit\.jsonl$
-/etc/nebulalog/bootstrap/firstboot\.lock$
-/var/lib/nebulalog/configuration/bootstrap/runtime\.lock$
-/var/lib/nebulalog/configuration/baseline\.lock$
-/var/lib/nebulalog/configuration/baseline-(assessment|review|attempt)\.json$
-/var/lib/nebulalog/configuration/baseline-audit\.jsonl$
-/var/lib/nebulalog/configuration/baseline-assessments(/.*)?

# Kernel-maintained link and interactive history are not static configuration.
-/etc/mtab$
-/root/\.bash_history$
-/root/\.viminfo$
-/root/\.lesshst$
-/root/\.cache(/.*)?

# Live database/log/container volumes and this monitor's own state are omitted.
# Only the explicitly selected canonical configuration tree above is included.
-/var/lib/nebulalog/manager(/.*)?
-/var/lib/nebulalog/containers(/.*)?
-/var/lib/nebulalog/postgresql(/.*)?
-/var/lib/nebulalog/clickhouse(/.*)?
-/var/lib/nebulalog/wal(/.*)?
-/var/lib/nebulalog/tmp(/.*)?
-/proc(/.*)?
-/sys(/.*)?
-/dev(/.*)?
-/run(/.*)?
-/tmp(/.*)?
-/var/log(/.*)?
